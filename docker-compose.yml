services:
  api:
    build: { context: ., dockerfile: Dockerfile.backend }
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
  web:
    build:
      context: frontend
      args: { VITE_API_URL: http://localhost:8000 }
    ports: ["5173:80"]
    depends_on: [api]
