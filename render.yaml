services:
  - type: web
    name: pneumoai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_UPLOAD_SIZE
        value: "10485760"
      - key: REQUESTS_PER_MINUTE
        value: "30"
